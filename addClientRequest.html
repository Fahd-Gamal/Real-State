<body>

        NAVBAR
    ====================================================== -->

        <div class="nq-nav-actions">
            <!-- Theme toggle -->
            <button class="theme-btn" id="themeToggle" aria-label="تبديل الوضع المظلم / الفاتح" type="button">
            <svg class="theme-icon icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true">

                    stroke-linecap="round" stroke-linejoin="round" fill="rgba(212,175,55,.10)" />

                <circle cx="21" cy="7" r=".7" fill="#D4AF37" opacity=".5" />
                <circle cx="16" cy="2" r=".5" fill="#D4AF37" opacity=".6" />

                    <line x1="17.24" y1="17.24" x2="19.07" y2="19.07" />
                    <line x1="4.93" y1="19.07" x2="6.76" y2="17.24" />

        </button>
            <button onclick="toggleMenu()" class="nq-hamburger-btn">

    <div class="ap-shell" style="margin-top: 60px;">
        <div class="ap-validation-summary" role="alert" aria-live="polite">
            <!-- MVC renders per-model errors here -->
            يوجد أخطاء في البيانات. يرجى مراجعة الحقول المحددة أدناه.
        </div>
        <form class="ap-form" method="post" enctype="multipart/form-data" action="" novalidate aria-label="نموذج إضافة عقار جديد" id="ap-main-form">
            <input type="hidden" name="__RequestVerificationToken" value="" />

            <!-- ══════════════════════════════
        CARD 1 — بيانات العميل
════════════════════════════════ -->
            <div class="ap-card" role="region" aria-labelledby="card1-title">
                <div class="ap-card-head">
                    <div class="ap-card-icon" aria-hidden="true">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="3" width="20" height="14" rx="2" />
                        <line x1="8" y1="21" x2="16" y2="21" />
                        <line x1="12" y1="17" x2="12" y2="21" />
                    </svg>
                    </div>
                    <h2 class="ap-card-title" id="card1-title">بيانات الطلب</h2>
                    <span class="ap-card-rule" aria-hidden="true"></span>
                </div>

                <div class="ap-card-body">
                    <div class="fields-grid">

                        <!-- اسم الطلب — full width -->
                        <div class="fl-field field-full">
                            <input class="fl-input" type="text" id="PropertyName" name="PropertyName" placeholder=" " maxlength="200" autocomplete="off" required aria-required="true" aria-describedby="PropertyName-err" />
                            <label class="fl-label" for="PropertyName">
                            اسم الطلب <span class="req">*</span>
                        </label>
                            <span class="fl-error-msg" id="PropertyName-err" role="alert"></span>
                        </div>

                        <!-- (Select) -->
                        <div class="fl-field">
                            <input class="fl-input" type="text" id="Location" name="Location" placeholder="مثال: المسلة" required aria-required="true" aria-describedby="Location-err" />

                            <label class="fl-label" for="Location">
                            المكان <span class="req">*</span>
                        </label>

                            <span class="fl-error-msg" id="Location-err" role="alert"></span>
                        </div>

                        <!-- نطاق السعر -->
                        <div class="fl-row">
                            <!-- أقل سعر -->
                            <div class="fl-field">
                                <div class="number-wrap">
                                    <input class="fl-input" type="number" id="MinPrice" name="MinPrice" placeholder=" " min="0" step="500">
                                    <div class="number-controls">
                                        <button type="button" class="num-btn num-up">
                                        <i class="fa-solid fa-chevron-up"></i>
                                    </button>
                                        <button type="button" class="num-btn num-down">
                                        <i class="fa-solid fa-chevron-down"></i>
                                    </button>
                                    </div>
                                </div>
                                <label class="fl-label" for="MinPrice">
                                أقل سعر (ج.م) <span class="req">*</span>
                            </label>
                                <span class="fl-error-msg" id="MinPrice-err"></span>
                            </div>
                            <!-- أعلى سعر -->
                            <div class="fl-field">
                                <div class="number-wrap">
                                    <input class="fl-input" type="number" id="MaxPrice" name="MaxPrice" placeholder=" " min="0" step="500">
                                    <div class="number-controls">
                                        <button type="button" class="num-btn num-up">
                                        <i class="fa-solid fa-chevron-up"></i>
                                    </button>
                                        <button type="button" class="num-btn num-down">
                                        <i class="fa-solid fa-chevron-down"></i>
                                    </button>
                                    </div>
                                </div>
                                <label class="fl-label" for="MaxPrice">
                                أعلى سعر (ج.م)
                            </label>
                                <span class="fl-error-msg" id="MaxPrice-err"></span>
                            </div>
                        </div>
                        <!-- عدد الأدوار -->
                        <div class="fl-field">
                            <div class="number-wrap">
                                <input class="fl-input" type="number" id="Floors" name="Floors" placeholder=" " min="1" max="50" required aria-required="true" aria-describedby="Floors-err" />

                                <label class="fl-label" for="Floors">
                                عدد الأدوار
                            </label>

                                <div class="number-controls">
                                    <button type="button" class="num-btn num-up" tabindex="-1">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </button>

                                    <button type="button" class="num-btn num-down" tabindex="-1">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </button>
                                </div>
                            </div>

                            <span class="fl-error-msg" id="Floors-err" role="alert"></span>
                        </div>

                        <!-- المساحة -->
                        <div class="fl-field">
                            <div class="number-wrap">
                                <input class="fl-input" type="number" id="Area" name="Area" placeholder=" " min="1" required aria-required="true" aria-describedby="Area-err" />

                                <label class="fl-label" for="Area">
                                المساحة (م²) <span class="req">*</span>
                            </label>

                                <div class="number-controls">
                                    <button type="button" class="num-btn num-up" tabindex="-1">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </button>

                                    <button type="button" class="num-btn num-down" tabindex="-1">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </button>
                                </div>
                            </div>

                            <span class="fl-error-msg" id="Area-err" role="alert"></span>
                        </div>

                        <!-- عدد الغرف -->
                        <div class="fl-field">
                            <div class="number-wrap">
                                <input class="fl-input" type="number" id="Rooms" name="Rooms" placeholder=" " min="0" max="20" required aria-required="true" aria-describedby="Rooms-err" />

                                <label class="fl-label" for="Rooms">
                                عدد الغرف
                            </label>

                                <div class="number-controls">
                                    <button type="button" class="num-btn num-up" tabindex="-1">
                                    <i class="fa-solid fa-chevron-up"></i>
                                </button>

                                    <button type="button" class="num-btn num-down" tabindex="-1">
                                    <i class="fa-solid fa-chevron-down"></i>
                                </button>
                                </div>
                            </div>

                            <span class="fl-error-msg" id="Rooms-err" role="alert"></span>
                        </div>
                        <!-- العنوان بالتفصيل — full width -->
                        <div class="fl-field field-full">
                            <textarea class="fl-input fl-textarea" id="AddressDetail" name="AddressDetail" placeholder=" " rows="3" maxlength="500" aria-describedby="AddressDetail-err"></textarea>
                            <label class="fl-label" for="AddressDetail">العنوان بالتفصيل</label>
                            <span class="fl-error-msg" id="AddressDetail-err" role="alert"></span>
                            <span class="fl-hint">مثال: الفيوم ،المسلة ، شارع 15</span>
                        </div>

                    </div>
                    <!-- /fields-grid -->
                </div>
            </div>
            <!-- /card 1 -->

            <!-- ══════════════════════════════
        CARD 2 — بيانات العميل
════════════════════════════════ -->
            <div class="ap-card" role="region" aria-labelledby="card2-title">
                <div class="ap-card-head">
                    <div class="ap-card-icon" aria-hidden="true">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                    </div>
                    <h2 class="ap-card-title" id="card2-title">بيانات العميل</h2>
                    <span class="ap-card-rule" aria-hidden="true"></span>
                </div>

                <div class="ap-card-body">
                    <div class="owner-grid">

                        <!-- اسم صاحب العقار -->
                        <div class="fl-field">
                            <input class="fl-input" type="text" id="OwnerName" name="OwnerName" placeholder=" " maxlength="120" autocomplete="name" required aria-required="true" aria-describedby="OwnerName-err" />
                            <label class="fl-label" for="OwnerName">
                            اسم العميل  <span class="req">*</span>
                        </label>
                            <span class="fl-error-msg" id="OwnerName-err" role="alert"></span>
                        </div>

                        <!-- رقم هاتف صاحب العقار -->
                        <div class="fl-field">
                            <input class="fl-input" type="tel" id="OwnerPhone" name="OwnerPhone" placeholder=" " maxlength="20" autocomplete="tel" required aria-required="true" aria-describedby="OwnerPhone-err" dir="ltr" style="text-align:right;" />
                            <label class="fl-label" for="OwnerPhone">
                            رقم الهاتف <span class="req">*</span>
                        </label>
                            <span class="fl-error-msg" id="OwnerPhone-err" role="alert"></span>
                            <span class="fl-hint" dir="ltr" style="text-align:right;">01XXXXXXXXX</span>
                        </div>

                    </div>
                </div>
            </div>
            <!-- /card 2 -->

            <!-- ══════════════════════════════
        CARD 3 — الملاحظات
════════════════════════════════ -->
            <div class="ap-card" role="region" aria-labelledby="card3-title">
                <div class="ap-card-head">
                    <div class="ap-card-icon" aria-hidden="true">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                        <line x1="16" y1="13" x2="8" y2="13" />
                        <line x1="16" y1="17" x2="8" y2="17" />
                        <polyline points="10 9 9 9 8 9" />
                    </svg>
                    </div>
                    <h2 class="ap-card-title" id="card3-title">الملاحظات</h2>
                    <span class="ap-card-rule" aria-hidden="true"></span>
                </div>

                <div class="ap-card-body">
                    <div class="fl-field" id="notesWrap">
                        <textarea class="fl-input fl-textarea fl-notes-textarea" id="Notes" name="Notes" placeholder="أضف أي ملاحظات خاصة بالعقار..." rows="5" maxlength="1000" aria-describedby="Notes-hint"></textarea>
                        <!-- No floating label here — placeholder is intentionally visible -->
                        <span class="fl-hint" id="Notes-hint">يظهر للموظفين</span>
                    </div>
                    <!-- <button type="button" class="btn-add-note" id="addNoteBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    <span>إضافة ملاحظة أخرى</span>
                </button> -->
                </div>
            </div>
            <!-- /card 4 -->
            <!-- ══════════════════════════════════
            STICKY BOTTOM ACTIONS
        ═══════════════════════════════════ -->
            <div class="ap-actions-outer">
                <div class="ap-actions">

                    <button type="submit" form="ap-main-form" class="btn-save-prop" aria-label="حفظ بيانات العقار وإرساله">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" />
                        <polyline points="17 21 17 13 7 13 7 21" />
                        <polyline points="7 3 7 8 15 8" />
                    </svg>
                    <span class="btn-save-label">حفظ العميل</span>
                </button>
                    <a href="#" class="btn-cancel-prop" aria-label="إلغاء وإغلاق النموذج">
                    إلغاء
                </a>

                </div>
            </div>
        </form>
        <!-- /ap-main-form -->

            </button>
            </div>
            <div class="nq-side-menu-links">
                <a href="dashbord.html" class="nq-side-menu-link">
                    <i class="fa-solid fa-building w-6"></i>
                    <span>العقارات</span>

                <a href="employee.html" class="nq-side-menu-link">

            </div>
        </div>
